<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SecureCheck</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            SecureCheck
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </nav>

    </header>


    <!-- Registration Form -->

    <main>

        <section class="auth-section">

            <h1>Create Account</h1>

            <p>Register to start your security assessment.</p>


            <form method="POST" action="/register">
                <input type="hidden" name="_csrf" value="{{ csrf_token }}">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="auth-link">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 SecureCheck. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
