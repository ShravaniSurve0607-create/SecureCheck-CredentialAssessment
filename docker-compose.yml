services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: securecheck-root
      MYSQL_DATABASE: credential_assessment
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecurecheck-root"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: securecheck-root
      MYSQL_DATABASE: credential_assessment
      SECRET_KEY: change-this-in-production
      SESSION_COOKIE_SECURE: "0"
      PORT: "5000"
    ports:
      - "5000:5000"
volumes:
  mysql_data:
